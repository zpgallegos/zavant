version: 2

models:
  - name: stg_batted_balls
    description: >-
      Contact measurements and classifications supplied by MLB for pitch
      events containing hit data in the current version of each
      game. Its grain is one batted-ball event at game_pk, at_bat_index, and
      event_index.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - game_pk
              - at_bat_index
              - event_index
    columns:
      # grain
      - name: game_pk
        description: MLB's stable identifier for the game.
        data_type: bigint
        data_tests:
          - not_null

      - name: at_bat_index
        description: Zero-based index of the top-level play containing the contact event.
        data_type: integer
        data_tests:
          - not_null

      - name: event_index
        description: Zero-based index of the contact event within the top-level play.
        data_type: integer
        data_tests:
          - not_null

      # attributes
      - name: coordinate_x
        description: Horizontal coordinate of the batted ball on MLB's hit-location chart.
        data_type: double

      - name: coordinate_y
        description: Vertical coordinate of the batted ball on MLB's hit-location chart.
        data_type: double

      - name: hardness
        description: MLB's qualitative classification of contact hardness.
        data_type: varchar

      - name: launch_angle
        description: Vertical launch angle of the batted ball, in degrees.
        data_type: double

      - name: launch_speed
        description: Exit velocity of the batted ball, in miles per hour.
        data_type: double

      - name: location
        description: MLB's coded fielding location for the batted ball.
        data_type: varchar

      - name: pitch_number
        description: Sequential pitch number within the top-level play.
        data_type: integer

      - name: play_id
        description: MLB identifier of the corresponding pitch event.
        data_type: varchar

      - name: total_distance
        description: Estimated total distance traveled by the batted ball, in feet.
        data_type: double

      - name: trajectory
        description: MLB's trajectory classification, such as ground ball or line drive.
        data_type: varchar

      # metadata
      - name: official_date
        description: Official MLB date of the game.
        data_type: date

      - name: season
        description: MLB season containing the game.
        data_type: integer
