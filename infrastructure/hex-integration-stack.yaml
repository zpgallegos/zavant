AWSTemplateFormatVersion: "2010-09-09"
Description: Athena query boundary and least-privilege role for Zavant Hex.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
  DataBucketName:
    Type: String
    Description: Existing bucket containing the materialized dbt tables.
  DataPrefix:
    Type: String
    Default: lake
    AllowedPattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*$"
  DbtDatabaseName:
    Type: String
    Description: Glue Data Catalog database exposed to Hex.
  QueryResultsRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 365
    Description: Days to retain ephemeral Athena query-result objects.
  BytesScannedCutoffPerQuery:
    Type: Number
    Default: 1073741824
    MinValue: 10485760
    Description: Maximum bytes an individual Hex query may scan.
  HexPrincipalArn:
    Type: String
    Default: ""
    Description: AWS principal ARN from the trust policy generated by Hex.
  HexExternalId:
    Type: String
    Default: ""
    NoEcho: true
    Description: External ID generated by Hex for role assumption.

Conditions:
  HasHexPrincipalArn: !Not [!Equals [!Ref HexPrincipalArn, ""]]
  HasHexExternalId: !Not [!Equals [!Ref HexExternalId, ""]]
  HasCompleteHexTrust: !And
    - !Condition HasHexPrincipalArn
    - !Condition HasHexExternalId

Resources:
  HexQueryResultsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireQueryResults
            Status: Enabled
            ExpirationInDays: !Ref QueryResultsRetentionDays
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: zavant
        - Key: Component
          Value: hex
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: cloudformation

  HexQueryResultsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref HexQueryResultsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt HexQueryResultsBucket.Arn
              - !Sub "${HexQueryResultsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  HexAthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Description: Cost-bounded Athena queries issued by Hex.
      Name: !Sub "zavant-hex-${EnvironmentName}"
      RecursiveDeleteOption: true
      State: ENABLED
      WorkGroupConfiguration:
        BytesScannedCutoffPerQuery: !Ref BytesScannedCutoffPerQuery
        EnforceWorkGroupConfiguration: true
        EngineVersion:
          SelectedEngineVersion: AUTO
        PublishCloudWatchMetricsEnabled: true
        RequesterPaysEnabled: false
        ResultConfiguration:
          EncryptionConfiguration:
            EncryptionOption: SSE_S3
          OutputLocation: !Sub "s3://${HexQueryResultsBucket}/"
      Tags:
        - Key: Project
          Value: zavant
        - Key: Component
          Value: hex
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: cloudformation

  HexWarehouseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "zavant-hex-${EnvironmentName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowHexAssumeRole
            Effect: Allow
            Principal:
              AWS: !If
                - HasCompleteHexTrust
                - !Ref HexPrincipalArn
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
            Condition: !If
              - HasCompleteHexTrust
              - StringEquals:
                  sts:ExternalId: !Ref HexExternalId
              - !Ref AWS::NoValue
          - Sid: AllowHexTagSession
            Effect: Allow
            Principal:
              AWS: !If
                - HasCompleteHexTrust
                - !Ref HexPrincipalArn
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: sts:TagSession
      Policies:
        - PolicyName: QueryZavantDbtTables
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: RunHexQueries
                Effect: Allow
                Action:
                  - athena:BatchGetQueryExecution
                  - athena:CreatePreparedStatement
                  - athena:DeletePreparedStatement
                  - athena:GetPreparedStatement
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                  - athena:GetQueryResultsStream
                  - athena:GetQueryRuntimeStatistics
                  - athena:GetWorkGroup
                  - athena:ListPreparedStatements
                  - athena:ListQueryExecutions
                  - athena:StartQueryExecution
                  - athena:StopQueryExecution
                  - athena:UpdatePreparedStatement
                Resource: !Sub >-
                  arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${HexAthenaWorkGroup}
              - Sid: DiscoverAthenaMetadata
                Effect: Allow
                Action:
                  - athena:ListDataCatalogs
                  - athena:ListDatabases
                  - athena:ListTableMetadata
                Resource: "*"
              - Sid: ReadAthenaTableMetadata
                Effect: Allow
                Action: athena:GetTableMetadata
                Resource: !Sub >-
                  arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:datacatalog/AwsDataCatalog
              - Sid: ReadDbtCatalog
                Effect: Allow
                Action:
                  - glue:BatchGetPartition
                  - glue:GetCatalog
                  - glue:GetDatabase
                  - glue:GetDatabases
                  - glue:GetPartition
                  - glue:GetPartitions
                  - glue:GetTable
                  - glue:GetTables
                  - glue:GetTableVersion
                  - glue:GetTableVersions
                Resource:
                  - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                  - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${DbtDatabaseName}"
                  - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${DbtDatabaseName}/*"
              - Sid: ListDbtTableObjects
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !Sub "arn:${AWS::Partition}:s3:::${DataBucketName}"
                Condition:
                  StringLike:
                    s3:prefix:
                      - !Sub "${DataPrefix}/transformation/dbt/${EnvironmentName}/tables"
                      - !Sub "${DataPrefix}/transformation/dbt/${EnvironmentName}/tables/*"
              - Sid: ReadDbtTableObjects
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub >-
                  arn:${AWS::Partition}:s3:::${DataBucketName}/${DataPrefix}/transformation/dbt/${EnvironmentName}/tables/*
              - Sid: UseQueryResultsBucket
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !GetAtt HexQueryResultsBucket.Arn
              - Sid: ManageQueryResultObjects
                Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:ListMultipartUploadParts
                  - s3:PutObject
                Resource: !Sub "${HexQueryResultsBucket.Arn}/*"
      Tags:
        - Key: Project
          Value: zavant
        - Key: Component
          Value: hex
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: cloudformation

Outputs:
  HexAthenaWorkGroupName:
    Description: Athena workgroup configured in the Hex data connection.
    Value: !Ref HexAthenaWorkGroup
  HexDatabaseName:
    Description: Athena database configured in the Hex data connection.
    Value: !Ref DbtDatabaseName
  HexQueryResultsS3Uri:
    Description: S3 output path configured in the Hex data connection.
    Value: !Sub "s3://${HexQueryResultsBucket}/"
  HexWarehouseRoleArn:
    Description: IAM role ARN configured in the Hex data connection.
    Value: !GetAtt HexWarehouseRole.Arn
  HexTrustConfigured:
    Description: Whether the role trusts the Hex principal with an external ID.
    Value: !If [HasCompleteHexTrust, "true", "false"]
