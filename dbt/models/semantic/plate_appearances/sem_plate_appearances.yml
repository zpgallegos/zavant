version: 2

semantic_models:
  - name: plate_appearances
    description: >-
      One current MLB plate appearance, with batting outcomes, participants,
      game state, and Savant values used by expected-stat and barrel metrics.
    model: ref('fct_plate_appearances')
    config:
      meta:
        hex:
          table: AwsDataCatalog.zavant_dbt_prod.fct_plate_appearances
    defaults:
      agg_time_dimension: official_date

    entities:
      - name: plate_appearance
        type: primary
        expr: plate_appearance_key

      - name: player
        type: foreign
        expr: result_batter_id

      - name: player_season
        type: foreign
        expr: >-
          concat(cast(result_batter_id as varchar), ':', cast(season as varchar))

      - name: team
        type: foreign
        expr: offense_team_id

    dimensions:
      - name: official_date
        type: time
        type_params:
          time_granularity: day

      - name: season
        type: categorical

      - name: game_pk
        type: categorical

      - name: result_batter_id
        type: categorical

      - name: result_pitcher_id
        type: categorical

      - name: offense_team_id
        type: categorical

      - name: defense_team_id
        type: categorical

      - name: inning
        type: categorical

      - name: half_inning
        type: categorical

      - name: is_top_inning
        type: categorical

      - name: outcome_group
        type: categorical

      - name: event_type
        type: categorical

      - name: bat_side_code
        type: categorical

      - name: pitch_hand_code
        type: categorical

      - name: batter_split
        type: categorical

      - name: pitcher_split
        type: categorical

      - name: men_on_base_split
        type: categorical

      - name: base_state_before
        type: categorical

      - name: base_state_after
        type: categorical

      - name: statcast_launch_speed_angle_code
        type: categorical

      - name: is_barrel
        type: categorical

    measures:
      - name: distinct_games
        description: Number of distinct games represented by the plate appearances.
        agg: count_distinct
        expr: game_pk

      - name: plate_appearances
        description: Number of completed plate appearances.
        agg: count
        expr: plate_appearance_key

      - name: at_bats
        description: Number of official at-bats.
        agg: sum
        expr: at_bat_ind

      - name: hits
        description: Number of hits of any type.
        agg: sum
        expr: hit_ind

      - name: singles
        description: Number of singles.
        agg: sum
        expr: single_ind

      - name: doubles
        description: Number of doubles.
        agg: sum
        expr: double_ind

      - name: triples
        description: Number of triples.
        agg: sum
        expr: triple_ind

      - name: home_runs
        description: Number of home runs.
        agg: sum
        expr: home_run_ind

      - name: total_bases
        description: Total bases credited on hits.
        agg: sum
        expr: total_bases

      - name: walks
        description: Number of walks, including intentional walks.
        agg: sum
        expr: walk_ind

      - name: intentional_walks
        description: Number of intentional walks.
        agg: sum
        expr: intentional_walk_ind

      - name: hit_by_pitch
        description: Number of times a batter was hit by a pitch.
        agg: sum
        expr: hit_by_pitch_ind

      - name: strikeouts
        description: Number of strikeouts.
        agg: sum
        expr: strikeout_ind

      - name: sacrifices
        description: Number of sacrifice bunts and sacrifice flies.
        agg: sum
        expr: sacrifice_ind

      - name: sacrifice_bunts
        description: Number of sacrifice bunts.
        agg: sum
        expr: sac_bunt_ind

      - name: sacrifice_flies
        description: Number of sacrifice flies.
        agg: sum
        expr: sac_fly_ind

      - name: reached_on_error
        description: Number of ordinary reached-on-error outcomes.
        agg: sum
        expr: reached_on_error_ind

      - name: runs_batted_in
        description: Runs batted in credited on plate appearances.
        agg: sum
        expr: coalesce(rbi, 0)

      - name: runs_scored_during_plate_appearances
        description: >-
          Batting-team runs scored during plate appearances, excluding runs on
          independent baserunning events.
        agg: sum
        expr: runs_scored_during_plate_appearance

      - name: times_on_base
        description: >-
          Number of times batters reached base via a hit, walk, or hit by
          pitch; the numerator used for on-base percentage.
        agg: sum
        expr: hit_ind + walk_ind + hit_by_pitch_ind

      - name: on_base_opportunities
        description: >-
          At-bats, walks, hit-by-pitches, and sacrifice flies; the denominator
          used for on-base percentage.
        agg: sum
        expr: at_bat_ind + walk_ind + hit_by_pitch_ind + sac_fly_ind

      - name: expected_hits
        description: >-
          Sum of Savant hit probabilities for official at-bat contact.
          Strikeouts contribute zero; contact with missing estimates stays
          null and is excluded from xBA eligibility, not treated as an out.
        agg: sum
        expr: if(is_at_bat and not is_strikeout, expected_batting_average, 0.0)

      - name: expected_batting_average_at_bats
        description: Official strikeout at-bats plus at-bats with a supplied hit probability, including zero.
        agg: sum
        expr: if(is_at_bat and (is_strikeout or expected_batting_average is not null), 1, 0)

      - name: expected_total_bases
        description: >-
          Sum of Savant expected total bases for official at-bat contact.
          Strikeouts contribute zero; missing contact estimates stay null.
        agg: sum
        expr: if(is_at_bat and not is_strikeout, expected_slugging_percentage, 0.0)

      - name: expected_slugging_at_bats
        description: >-
          Official strikeout at-bats plus at-bats with supplied expected total
          bases, including zero. Eligibility is independent of xBA coverage.
        agg: sum
        expr: if(is_at_bat and (is_strikeout or expected_slugging_percentage is not null), 1, 0)

      - name: expected_woba_numerator
        description: >-
          Sum of Savant expected wOBA values across outcomes included in the
          wOBA denominator.
        agg: sum
        expr: expected_woba_value * woba_denominator

      - name: woba_numerator
        description: Sum of observed outcome contributions weighted for each row's season.
        agg: sum
        expr: woba_numerator

      - name: woba_opportunities
        description: Official AB + unintentional BB + HBP + SF; independent of Savant coverage.
        agg: sum
        expr: woba_opportunity_ind

      - name: woba_denominator
        description: Sum of Savant outcome contributions to the wOBA denominator.
        agg: sum
        expr: woba_denominator

      - name: barrels_per_plate_appearance
        description: >-
          Average of the plate-appearance barrel indicator, equivalent to
          barrels divided by completed plate appearances.
        agg: average
        expr: barrel_ind
