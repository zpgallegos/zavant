AWSTemplateFormatVersion: "2010-09-09"
Description: Durable storage and scheduled execution for Zavant acquisition.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment used for resource tags.
  AcquisitionPrefix:
    Type: String
    Default: lake
    AllowedPattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*$"
    Description: S3 key prefix reserved for the acquisition application.
  LambdaCodeS3Key:
    Type: String
    Default: ""
    Description: Content-addressed deployment package key; empty omits Lambda.
  InitialScheduleDate:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
    Description: First schedule date used while no schedule watermark exists.
  InitialCorrectionWatermark:
    Type: String
    Default: ""
    Description: First correction boundary used while no correction watermark exists.
  DailyScheduleExpression:
    Type: String
    Default: "cron(0 6 * * ? *)"
    Description: EventBridge Scheduler expression for daily acquisition.
  DailyScheduleTimezone:
    Type: String
    Default: America/Los_Angeles
    Description: IANA timezone used to interpret the daily schedule expression.
  DailyScheduleState:
    Type: String
    Default: ENABLED
    AllowedValues:
      - ENABLED
      - DISABLED
    Description: Whether EventBridge Scheduler invokes daily acquisition.

Conditions:
  HasLambdaCode: !Not [!Equals [!Ref LambdaCodeS3Key, ""]]

Resources:
  AcquisitionBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: zavant
        - Key: Component
          Value: acquisition
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: cloudformation
      VersioningConfiguration:
        Status: Enabled

  AcquisitionBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref AcquisitionBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt AcquisitionBucket.Arn
              - !Sub "${AcquisitionBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  AcquisitionLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Executes the Zavant daily acquisition Lambda function.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AcquisitionPrefixAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListAcquisitionPrefix
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt AcquisitionBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - !Ref AcquisitionPrefix
                      - !Sub "${AcquisitionPrefix}/*"
              - Sid: ReadWriteAcquisitionObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${AcquisitionBucket.Arn}/${AcquisitionPrefix}/*"
        - PolicyName: AcquisitionLogDelivery
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteFunctionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/zavant-acquisition-daily-${EnvironmentName}:*"
      Tags:
        - Key: Project
          Value: zavant
        - Key: Component
          Value: acquisition
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: cloudformation

  AcquisitionLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: HasLambdaCode
    Properties:
      LogGroupName: !Sub "/aws/lambda/zavant-acquisition-daily-${EnvironmentName}"
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: zavant
        - Key: Component
          Value: acquisition
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: cloudformation

  AcquisitionLambdaFunction:
    Type: AWS::Lambda::Function
    Condition: HasLambdaCode
    DependsOn: AcquisitionLambdaLogGroup
    Properties:
      FunctionName: !Sub "zavant-acquisition-daily-${EnvironmentName}"
      Description: Runs schedule discovery and correction-aware MLB acquisition.
      Architectures:
        - arm64
      Code:
        S3Bucket: !Ref AcquisitionBucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          ZAVANT_INITIAL_CORRECTION_WATERMARK: !Ref InitialCorrectionWatermark
          ZAVANT_INITIAL_SCHEDULE_DATE: !Ref InitialScheduleDate
          ZAVANT_S3_BUCKET: !Ref AcquisitionBucket
          ZAVANT_S3_PREFIX: !Ref AcquisitionPrefix
      Handler: zavant.lambda_handler.lambda_handler
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        SystemLogLevel: WARN
      MemorySize: 512
      Role: !GetAtt AcquisitionLambdaExecutionRole.Arn
      Runtime: python3.12
      Timeout: 900
      Tags:
        - Key: Project
          Value: zavant
        - Key: Component
          Value: acquisition
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: cloudformation

  AcquisitionScheduleExecutionRole:
    Type: AWS::IAM::Role
    Condition: HasLambdaCode
    Properties:
      Description: Allows EventBridge Scheduler to invoke daily acquisition.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule-group/default"
      Policies:
        - PolicyName: InvokeDailyAcquisition
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InvokeDailyAcquisition
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt AcquisitionLambdaFunction.Arn
      Tags:
        - Key: Project
          Value: zavant
        - Key: Component
          Value: acquisition
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: cloudformation

  AcquisitionDailySchedule:
    Type: AWS::Scheduler::Schedule
    Condition: HasLambdaCode
    Properties:
      Description: Invokes the complete Zavant daily acquisition workflow.
      FlexibleTimeWindow:
        Mode: "OFF"
      GroupName: default
      Name: !Sub "zavant-acquisition-daily-${EnvironmentName}"
      ScheduleExpression: !Ref DailyScheduleExpression
      ScheduleExpressionTimezone: !Ref DailyScheduleTimezone
      State: !Ref DailyScheduleState
      Target:
        Arn: !GetAtt AcquisitionLambdaFunction.Arn
        Input: "{}"
        RetryPolicy:
          MaximumEventAgeInSeconds: 3600
          MaximumRetryAttempts: 2
        RoleArn: !GetAtt AcquisitionScheduleExecutionRole.Arn

Outputs:
  AcquisitionBucketArn:
    Description: ARN used by future least-privilege IAM policies.
    Value: !GetAtt AcquisitionBucket.Arn
    Export:
      Name: !Sub "${AWS::StackName}-AcquisitionBucketArn"
  AcquisitionBucketName:
    Description: Value to supply as ZAVANT_S3_BUCKET.
    Value: !Ref AcquisitionBucket
    Export:
      Name: !Sub "${AWS::StackName}-AcquisitionBucketName"
  AcquisitionPrefix:
    Description: S3 prefix granted to the acquisition Lambda execution role.
    Value: !Ref AcquisitionPrefix
    Export:
      Name: !Sub "${AWS::StackName}-AcquisitionPrefix"
  AcquisitionLambdaExecutionRoleArn:
    Description: ARN used by the daily acquisition Lambda function.
    Value: !GetAtt AcquisitionLambdaExecutionRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-AcquisitionLambdaExecutionRoleArn"
  AcquisitionLambdaExecutionRoleName:
    Description: Generated name of the daily acquisition Lambda execution role.
    Value: !Ref AcquisitionLambdaExecutionRole
  AcquisitionLambdaFunctionArn:
    Condition: HasLambdaCode
    Description: ARN of the scheduled daily acquisition function.
    Value: !GetAtt AcquisitionLambdaFunction.Arn
  AcquisitionLambdaFunctionName:
    Condition: HasLambdaCode
    Description: Name of the scheduled daily acquisition function.
    Value: !Ref AcquisitionLambdaFunction
  AcquisitionDailyScheduleArn:
    Condition: HasLambdaCode
    Description: ARN of the EventBridge Scheduler schedule.
    Value: !GetAtt AcquisitionDailySchedule.Arn
  AcquisitionDailyScheduleName:
    Condition: HasLambdaCode
    Description: Name of the EventBridge Scheduler schedule.
    Value: !Ref AcquisitionDailySchedule
