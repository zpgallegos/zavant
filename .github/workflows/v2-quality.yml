name: Zavant v2 quality

on:
  pull_request:
    paths:
      - ".github/workflows/v2-quality.yml"
      - "v2/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/v2-quality.yml"
      - "v2/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            v2/constraints.txt
            v2/pyproject.toml
      - run: make bootstrap
      - run: make check
