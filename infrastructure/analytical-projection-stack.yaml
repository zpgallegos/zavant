AWSTemplateFormatVersion: "2010-09-09"
Description: Glue and Iceberg execution boundary for Zavant analytical projection.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
  DataBucketName:
    Type: String
    Description: Existing acquisition bucket containing raw and analytical prefixes.
  DataPrefix:
    Type: String
    Default: lake
    AllowedPattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*$"
  GlueScriptS3Key:
    Type: String
    Description: S3 key containing the Glue Python entry point.
  GlueLibraryS3Key:
    Type: String
    Description: S3 key containing the packaged Zavant Python library.
  MaximumProjectionPartitions:
    Type: Number
    Default: 64
    MinValue: 1
    MaxValue: 200
  AthenaWorkGroup:
    Type: String
    Default: primary
    Description: Athena workgroup used to publish current analytical views.

Resources:
  AnalyticalDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Description: Revision-aware Zavant Iceberg v2 analytical tables.
        Name: !Sub "zavant_analytical_${EnvironmentName}"

  AnalyticalProjectionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Reconciles Stats API and Savant revisions into current views.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ProjectionObjectAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListProjectionPrefixes
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:${AWS::Partition}:s3:::${DataBucketName}"
                Condition:
                  StringLike:
                    s3:prefix:
                      - !Sub "${DataPrefix}/raw"
                      - !Sub "${DataPrefix}/raw/*"
                      - !Sub "${DataPrefix}/analytical"
                      - !Sub "${DataPrefix}/analytical/*"
                      - deployments/glue
                      - deployments/glue/*
              - Sid: InspectBucketAndMultipartUploads
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucketMultipartUploads
                Resource: !Sub "arn:${AWS::Partition}:s3:::${DataBucketName}"
              - Sid: ReadRawAndDeploymentObjects
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${DataBucketName}/${DataPrefix}/raw/*"
                  - !Sub "arn:${AWS::Partition}:s3:::${DataBucketName}/deployments/glue/*"
              - Sid: ManageAnalyticalObjects
                Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:ListMultipartUploadParts
                  - s3:PutObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${DataBucketName}/${DataPrefix}/analytical/*"
        - PolicyName: ProjectionGlueCatalogAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadCatalog
                Effect: Allow
                Action:
                  - glue:GetCatalog
                  - glue:GetDatabase
                  - glue:GetDatabases
                Resource:
                  - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                  - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${AnalyticalDatabase}"
              - Sid: ManageAnalyticalTables
                Effect: Allow
                Action:
                  - glue:CreateTable
                  - glue:GetTable
                  - glue:GetTables
                  - glue:GetTableVersion
                  - glue:GetTableVersions
                  - glue:UpdateTable
                Resource:
                  - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                  - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${AnalyticalDatabase}"
                  - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${AnalyticalDatabase}/*"
        - PolicyName: ProjectionAthenaViewAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PublishCurrentViews
                Effect: Allow
                Action:
                  - athena:GetQueryExecution
                  - athena:StartQueryExecution
                Resource: !Sub "arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${AthenaWorkGroup}"
        - PolicyName: ProjectionLogDelivery
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteGlueLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws-glue/*"
              - Sid: PublishGlueMetrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
      Tags:
        - Key: Project
          Value: zavant
        - Key: Component
          Value: analytical-projection
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: cloudformation

  AnalyticalProjectionJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub "zavant-analytical-projection-${EnvironmentName}"
      Description: Reconciles Stats API and Savant revisions into current views.
      Role: !GetAtt AnalyticalProjectionExecutionRole.Arn
      GlueVersion: "5.0"
      Command:
        Name: glueetl
        PythonVersion: "3"
        ScriptLocation: !Sub "s3://${DataBucketName}/${GlueScriptS3Key}"
      DefaultArguments:
        "--athena-workgroup": !Ref AthenaWorkGroup
        "--bucket": !Ref DataBucketName
        "--catalog": glue_catalog
        "--database": !Ref AnalyticalDatabase
        "--datalake-formats": iceberg
        "--enable-continuous-cloudwatch-log": "true"
        "--enable-glue-datacatalog": "true"
        "--enable-metrics": "true"
        "--extra-py-files": !Sub "s3://${DataBucketName}/${GlueLibraryS3Key}"
        "--job-language": python
        "--max-projection-partitions": !Ref MaximumProjectionPartitions
        "--prefix": !Ref DataPrefix
        "--TempDir": !Sub "s3://${DataBucketName}/${DataPrefix}/analytical/glue-temp/"
        "--conf": !Sub >-
          spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
          --conf spark.sql.catalog.glue_catalog=org.apache.iceberg.spark.SparkCatalog
          --conf spark.sql.catalog.glue_catalog.warehouse=s3://${DataBucketName}/${DataPrefix}/analytical/iceberg
          --conf spark.sql.catalog.glue_catalog.catalog-impl=org.apache.iceberg.aws.glue.GlueCatalog
          --conf spark.sql.catalog.glue_catalog.io-impl=org.apache.iceberg.aws.s3.S3FileIO
      ExecutionClass: STANDARD
      ExecutionProperty:
        MaxConcurrentRuns: 1
      MaxRetries: 0
      NumberOfWorkers: 2
      Timeout: 180
      WorkerType: G.1X
      Tags:
        Project: zavant
        Component: analytical-projection
        Environment: !Ref EnvironmentName
        ManagedBy: cloudformation

Outputs:
  AnalyticalDatabaseName:
    Description: Glue Data Catalog database containing Zavant Iceberg tables.
    Value: !Ref AnalyticalDatabase
  AnalyticalProjectionExecutionRoleArn:
    Value: !GetAtt AnalyticalProjectionExecutionRole.Arn
  AnalyticalProjectionJobName:
    Value: !Ref AnalyticalProjectionJob
