version: 2

models:
  - name: stg_projection_revisions
    description: >-
      Registry of raw-game revisions successfully published to the analytical
      Iceberg tables under the supported projection contract. A game can have
      multiple rows when MLB has revised its source response. Its grain is the
      combination of game_pk, source_revision_id, and
      projection_contract_version.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - game_pk
              - source_revision_id
              - projection_contract_version
    columns:
      # grain
      - name: game_pk
        description: MLB's stable identifier for the game.
        data_type: bigint
        data_tests:
          - not_null

      - name: source_revision_id
        description: >-
          SHA-256 content identity of the immutable raw game response that was
          projected.
        data_type: varchar
        data_tests:
          - not_null

      - name: projection_contract_version
        description: >-
          Version of the analytical projection contract used to publish the
          revision.
        data_type: varchar
        data_tests:
          - not_null

      # metadata
      - name: projected_at
        description: UTC timestamp when the revision was published successfully.
        data_type: timestamp

      - name: projection_run_id
        description: UUID of the Glue reconciliation run that published the revision.
        data_type: varchar

      - name: raw_object_uri
        description: S3 URI of the immutable raw game JSON that was projected.
        data_type: varchar

      - name: season
        description: MLB season containing the game.
        data_type: integer
