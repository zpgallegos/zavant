version: 2

models:
  - name: stg_fielding_credits
    description: >-
      Fielders credited by MLB for their roles in runner outcomes from the
      current version of each game. A runner movement can credit
      multiple fielders for roles such as a putout, assist, fielded ball,
      deflection, or fielding error. Its grain is one fielding credit at
      game_pk, at_bat_index, runner_index, and credit_index.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - game_pk
              - at_bat_index
              - runner_index
              - credit_index
    columns:
      # grain
      - name: game_pk
        description: MLB's stable identifier for the game.
        data_type: bigint
        data_tests:
          - not_null

      - name: at_bat_index
        description: Zero-based index of the top-level play containing the runner outcome.
        data_type: integer
        data_tests:
          - not_null

      - name: runner_index
        description: Zero-based index of the runner movement within the top-level play.
        data_type: integer
        data_tests:
          - not_null

      - name: credit_index
        description: Zero-based index of the fielding credit within the runner movement.
        data_type: integer
        data_tests:
          - not_null

      # attributes
      - name: credit
        description: MLB code describing the fielder's role in the runner outcome.
        data_type: varchar

      - name: play_event_index
        description: Index of the play event associated with the runner outcome.
        data_type: integer

      - name: player_id
        description: MLB identifier of the fielder receiving the credit.
        data_type: bigint

      - name: position_abbreviation
        description: Abbreviation of the fielder's position for this credit.
        data_type: varchar

      - name: position_code
        description: MLB code for the fielder's position for this credit.
        data_type: varchar

      - name: position_name
        description: Name of the fielder's position for this credit.
        data_type: varchar

      - name: position_type
        description: Broad position category of the credited fielder.
        data_type: varchar

      # metadata
      - name: official_date
        description: Official MLB date of the game.
        data_type: date

      - name: season
        description: MLB season containing the game.
        data_type: integer
