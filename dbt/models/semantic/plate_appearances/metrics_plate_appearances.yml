version: 2

metrics:
  - name: distinct_games
    label: Distinct Games
    description: Number of distinct games represented by the plate appearances.
    type: simple
    type_params:
      measure: distinct_games

  - name: plate_appearances
    label: Plate Appearances (PA)
    description: Number of completed plate appearances.
    type: simple
    type_params:
      measure: plate_appearances

  - name: at_bats
    label: At-Bats (AB)
    description: Number of official at-bats.
    type: simple
    type_params:
      measure: at_bats

  - name: hits
    label: Hits (H)
    description: Number of hits of any type.
    type: simple
    type_params:
      measure: hits

  - name: singles
    label: Singles (1B)
    description: Number of singles.
    type: simple
    type_params:
      measure: singles

  - name: doubles
    label: Doubles (2B)
    description: Number of doubles.
    type: simple
    type_params:
      measure: doubles

  - name: triples
    label: Triples (3B)
    description: Number of triples.
    type: simple
    type_params:
      measure: triples

  - name: home_runs
    label: Home Runs (HR)
    description: Number of home runs.
    type: simple
    type_params:
      measure: home_runs

  - name: total_bases
    label: Total Bases
    description: Total bases credited on hits.
    type: simple
    type_params:
      measure: total_bases

  - name: walks
    label: Walks (BB)
    description: Number of walks, including intentional walks.
    type: simple
    type_params:
      measure: walks

  - name: intentional_walks
    label: Intentional Walks (IBB)
    description: Number of intentional walks.
    type: simple
    type_params:
      measure: intentional_walks

  - name: hit_by_pitch
    label: Hit by Pitch (HBP)
    description: Number of times a batter was hit by a pitch.
    type: simple
    type_params:
      measure: hit_by_pitch

  - name: strikeouts
    label: Strikeouts (SO)
    description: Number of strikeouts.
    type: simple
    type_params:
      measure: strikeouts

  - name: sacrifices
    label: Sacrifices
    description: Number of sacrifice bunts and sacrifice flies.
    type: simple
    type_params:
      measure: sacrifices

  - name: sacrifice_bunts
    label: Sacrifice Bunts
    description: Number of sacrifice bunts.
    type: simple
    type_params:
      measure: sacrifice_bunts

  - name: sacrifice_flies
    label: Sacrifice Flies (SF)
    description: Number of sacrifice flies.
    type: simple
    type_params:
      measure: sacrifice_flies

  - name: reached_on_error
    label: Reached on Error (ROE)
    description: Number of ordinary reached-on-error outcomes.
    type: simple
    type_params:
      measure: reached_on_error

  - name: runs_batted_in
    label: Runs Batted In (RBI)
    description: Runs batted in credited on plate appearances.
    type: simple
    type_params:
      measure: runs_batted_in

  - name: runs_scored_during_plate_appearances
    label: Runs Scored During Plate Appearances
    description: >-
      Batting-team runs scored during plate appearances, excluding runs on
      independent baserunning events.
    type: simple
    type_params:
      measure: runs_scored_during_plate_appearances

  - name: times_on_base
    label: Times on Base
    description: >-
      Hits, walks, and hit-by-pitch outcomes included in the numerator of
      on-base percentage.
    type: simple
    type_params:
      measure: times_on_base

  - name: on_base_opportunities
    label: On-Base Opportunities
    description: >-
      Official at-bats, walks, hit-by-pitch outcomes, and sacrifice flies
      included in the denominator of on-base percentage.
    type: simple
    type_params:
      measure: on_base_opportunities

  - name: expected_woba_numerator
    label: Expected wOBA Numerator
    description: Sum of Savant expected wOBA values for included outcomes.
    type: simple
    type_params:
      measure: expected_woba_numerator

  - name: woba_denominator
    label: wOBA Denominator
    description: Number of outcome opportunities included in wOBA.
    type: simple
    type_params:
      measure: woba_denominator

  - name: expected_hits
    label: Expected Hits (xH)
    description: Sum of Savant hit probabilities across terminal outcomes.
    type: simple
    type_params:
      measure: expected_hits

  - name: expected_total_bases
    label: Expected Total Bases (xTB)
    description: Sum of Savant expected total-base values across terminal outcomes.
    type: simple
    type_params:
      measure: expected_total_bases

  - name: batting_average
    label: Batting Average (AVG)
    description: Hits divided by official at-bats.
    type: ratio
    type_params:
      numerator: hits
      denominator: at_bats

  - name: on_base_percentage
    label: On-Base Percentage (OBP)
    description: Times on base divided by on-base opportunities.
    type: ratio
    type_params:
      numerator: times_on_base
      denominator: on_base_opportunities

  - name: slugging_percentage
    label: Slugging Percentage (SLG)
    description: Total bases divided by official at-bats.
    type: ratio
    type_params:
      numerator: total_bases
      denominator: at_bats

  - name: expected_weighted_on_base_average
    label: Expected Weighted On-Base Average (xwOBA)
    description: >-
      Savant expected wOBA values divided by the corresponding wOBA outcome
      opportunities.
    type: ratio
    type_params:
      numerator: expected_woba_numerator
      denominator: woba_denominator

  - name: expected_batting_average
    label: Expected Batting Average (xBA)
    description: >-
      Expected hits divided by official at-bats. Strikeout at-bats contribute
      to the denominator without contributing expected hits.
    type: ratio
    type_params:
      numerator: expected_hits
      denominator: at_bats

  - name: expected_slugging_percentage
    label: Expected Slugging Percentage (xSLG)
    description: Savant expected total bases divided by official at-bats.
    type: ratio
    type_params:
      numerator: expected_total_bases
      denominator: at_bats

  - name: barrels_per_plate_appearance
    label: Barrels per Plate Appearance
    description: Share of completed plate appearances ending in a Savant barrel.
    type: simple
    type_params:
      measure: barrels_per_plate_appearance

  - name: on_base_plus_slugging
    label: On-Base Plus Slugging (OPS)
    description: On-base percentage plus slugging percentage.
    type: derived
    type_params:
      expr: on_base_percentage + slugging_percentage
      metrics:
        - name: on_base_percentage
        - name: slugging_percentage

  - name: walk_rate
    label: Walk Rate
    description: Walks, including intentional walks, divided by plate appearances.
    type: ratio
    type_params:
      numerator: walks
      denominator: plate_appearances

  - name: strikeout_rate
    label: Strikeout Rate
    description: Strikeouts divided by plate appearances.
    type: ratio
    type_params:
      numerator: strikeouts
      denominator: plate_appearances

  - name: home_run_rate
    label: Home Run Rate
    description: Home runs divided by plate appearances.
    type: ratio
    type_params:
      numerator: home_runs
      denominator: plate_appearances

  - name: isolated_power
    label: Isolated Power
    description: >-
      Slugging percentage minus batting average, measuring extra bases per
      at-bat beyond the value of a single.
    type: derived
    type_params:
      expr: slugging_percentage - batting_average
      metrics:
        - name: slugging_percentage
        - name: batting_average

  - name: batting_average_on_balls_in_play
    label: Batting Average on Balls in Play (BABIP)
    description: >-
      Non-home-run hits divided by at-bats excluding strikeouts and home runs,
      with sacrifice flies restored to the balls-in-play denominator.
    type: derived
    type_params:
      expr: >-
        (hits - home_runs)
        / nullif(at_bats - strikeouts - home_runs + sacrifice_flies, 0)
      metrics:
        - name: hits
        - name: home_runs
        - name: at_bats
        - name: strikeouts
        - name: sacrifice_flies

  - name: extra_base_hits
    label: Extra-Base Hits
    description: Doubles, triples, and home runs.
    type: derived
    type_params:
      expr: doubles + triples + home_runs
      metrics:
        - name: doubles
        - name: triples
        - name: home_runs

  - name: extra_base_hit_share
    label: Extra-Base Hit Share
    description: Extra-base hits divided by all hits.
    type: ratio
    type_params:
      numerator: extra_base_hits
      denominator: hits

  - name: extra_base_hit_rate
    label: Extra-Base Hit Rate
    description: Extra-base hits divided by plate appearances.
    type: ratio
    type_params:
      numerator: extra_base_hits
      denominator: plate_appearances

  - name: runs_batted_in_per_plate_appearance
    label: Runs Batted In per Plate Appearance
    description: Runs batted in divided by plate appearances.
    type: ratio
    type_params:
      numerator: runs_batted_in
      denominator: plate_appearances
