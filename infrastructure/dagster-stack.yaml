AWSTemplateFormatVersion: '2010-09-09'
Description: Single-host Dagster external-publication monitoring and dbt builds

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet with an Internet Gateway route; no NAT gateway is created
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Must be the availability zone of SubnetId
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.small, t3.medium, t3.large]
  DataBucketName:
    Type: String
    AllowedPattern: '[a-z0-9][a-z0-9.-]+[a-z0-9]'
  DataPrefix:
    Type: String
    Default: lake
    AllowedPattern: '[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*'
  DbtDataPrefix:
    Type: String
    Description: Existing dbt S3 data prefix, without leading/trailing slash (verify before deployment)
    AllowedPattern: '[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*'
  ReleaseKey:
    Type: String
    AllowedPattern: 'deployments/dagster/[a-f0-9]{64}\.tar\.gz'
  ReleaseSha256:
    Type: String
    AllowedPattern: '[a-f0-9]{64}'
  AlertEmail:
    Type: String
    Default: ''
    Description: Optional SNS email subscription; recipient must confirm it

# The repo's dbt sources currently name zavant_analytical_prod explicitly.
# This host intentionally targets that existing stack, not an invented dev lake.
Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]

Resources:
  Alerts:
    Type: AWS::SNS::Topic
    Properties:
      Tags:
        - {Key: Project, Value: zavant}
        - {Key: Component, Value: dagster}
  AlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref Alerts
      Protocol: email
      Endpoint: !Ref AlertEmail
  Workgroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub '${AWS::StackName}-queries'
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        BytesScannedCutoffPerQuery: 10737418240
        EngineVersion: {SelectedEngineVersion: Athena engine version 3}
        ResultConfiguration:
          OutputLocation: !Sub 's3://${DataBucketName}/${DataPrefix}/analytical/athena-results/dagster/'
          EncryptionConfiguration: {EncryptionOption: SSE_S3}
  HostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: No inbound traffic; SSM tunnel to loopback-only Dagster UI
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
  HostRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Policies:
        - PolicyName: DagsterWorkload
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [athena:StartQueryExecution, athena:GetQueryExecution, athena:GetQueryResults, athena:StopQueryExecution, athena:GetWorkGroup, athena:BatchGetQueryExecution]
                Resource: !Sub 'arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${Workgroup}'
              - Effect: Allow
                Action: athena:GetDataCatalog
                Resource: !Sub 'arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:datacatalog/AwsDataCatalog'
              - Effect: Allow
                Action: [glue:GetDatabase, glue:GetDatabases, glue:GetTable, glue:GetTables, glue:GetTableVersion, glue:GetTableVersions, glue:GetPartition, glue:GetPartitions, glue:BatchGetPartition]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog'
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/zavant_analytical_prod'
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/zavant_analytical_prod/*'
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/zavant_dbt_prod'
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/zavant_dbt_prod/*'
              - Effect: Allow
                Action: [glue:CreateDatabase, glue:CreateTable, glue:UpdateTable, glue:DeleteTable, glue:BatchCreatePartition, glue:BatchDeletePartition]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog'
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/zavant_dbt_prod'
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/zavant_dbt_prod/*'
              - Effect: Allow
                Action: s3:GetBucketLocation
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${DataBucketName}'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${DataBucketName}'
                Condition:
                  StringLike:
                    s3:prefix:
                      - !Sub '${DataPrefix}/analytical/*'
                      - !Sub '${DataPrefix}/runs/daily/*'
                      - !Sub '${DataPrefix}/runs/baseball_savant/daily/*'
                      - !Sub '${DbtDataPrefix}/*'
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${DataBucketName}/${ReleaseKey}'
                  - !Sub 'arn:${AWS::Partition}:s3:::${DataBucketName}/${DataPrefix}/analytical/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${DataBucketName}/${DataPrefix}/runs/daily/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${DataBucketName}/${DataPrefix}/runs/baseball_savant/daily/*'
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:AbortMultipartUpload, s3:ListMultipartUploadParts]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${DataBucketName}/${DbtDataPrefix}/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${DataBucketName}/${DataPrefix}/analytical/athena-results/*'
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref Alerts
              - Effect: Allow
                Action: cloudformation:SignalResource
                Resource: !Ref AWS::StackId
  HostProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref HostRole]
  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !Ref AvailabilityZone
      Encrypted: true
      Size: 20
      VolumeType: gp3
      Tags:
        - {Key: Project, Value: zavant}
        - {Key: Component, Value: dagster-state}
        - {Key: Environment, Value: prod}
  Host:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal: {Timeout: PT30M, Count: 1}
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      AvailabilityZone: !Ref AvailabilityZone
      IamInstanceProfile: !Ref HostProfile
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      CreditSpecification: {CPUCredits: standard}
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeSize: 20, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
      # Attach as part of instance creation, not a separate resource waiting
      # for the instance's success signal (which would deadlock bootstrap).
      Volumes:
        - Device: /dev/sdf
          VolumeId: !Ref DataVolume
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref HostSecurityGroup]
      Tags:
        - {Key: Name, Value: !Sub '${AWS::StackName}-host'}
        - {Key: Project, Value: zavant}
        - {Key: Component, Value: dagster}
        - {Key: Environment, Value: prod}
        - {Key: ManagedBy, Value: cloudformation}
      UserData:
        Fn::Base64: !Sub |
          #!/usr/bin/env bash
          set -euo pipefail
          signal_result() {
            result=$?
            status=FAILURE
            if [[ $result -eq 0 ]]; then status=SUCCESS; fi
            aws cloudformation signal-resource --region '${AWS::Region}' \
              --stack-name '${AWS::StackName}' --logical-resource-id Host \
              --unique-id bootstrap --status "$status"
          }
          trap signal_result EXIT
          install -d -m 0750 /opt/zavant/app /etc/zavant
          aws s3 cp 's3://${DataBucketName}/${ReleaseKey}' /opt/zavant/release.tar.gz --region '${AWS::Region}'
          echo '${ReleaseSha256}  /opt/zavant/release.tar.gz' | sha256sum --check -
          tar --extract --gzip --file /opt/zavant/release.tar.gz --directory /opt/zavant/app --no-same-owner
          cat > /etc/zavant/dagster.env <<'ENV'
          DAGSTER_HOME=/var/lib/zavant/dagster
          DBT_PROFILES_DIR=/opt/zavant/app/infrastructure/dagster
          DBT_TARGET=prod
          PYTHONPATH=/opt/zavant/app/src
          ZAVANT_AWS_REGION=${AWS::Region}
          AWS_DEFAULT_REGION=${AWS::Region}
          ZAVANT_DEPLOYMENT_ENVIRONMENT=prod
          ZAVANT_S3_BUCKET=${DataBucketName}
          ZAVANT_S3_PREFIX=${DataPrefix}
          ZAVANT_DBT_DATA_PREFIX=${DbtDataPrefix}
          ZAVANT_ANALYTICAL_ATHENA_WORKGROUP=${Workgroup}
          ZAVANT_DAGSTER_ALERT_TOPIC_ARN=${Alerts}
          ENV
          chmod 0644 /etc/zavant/dagster.env
          export DAGSTER_HOME=/var/lib/zavant/dagster
          export DAGSTER_DATA_VOLUME_ID='${DataVolume}'
          bash /opt/zavant/app/infrastructure/dagster/install.sh
  HostStatusAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Dagster host failed EC2 status checks (not a daemon heartbeat check)
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions:
        - {Name: InstanceId, Value: !Ref Host}
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref Alerts]
  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref Alerts]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudwatch.amazonaws.com}
            Action: sns:Publish
            Resource: !Ref Alerts
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !GetAtt HostStatusAlarm.Arn

Outputs:
  InstanceId: {Value: !Ref Host}
  DataVolumeId: {Value: !Ref DataVolume}
  AlertTopicArn: {Value: !Ref Alerts}
  AthenaWorkgroup: {Value: !Ref Workgroup}
  UiTunnelCommand:
    Value: !Sub >-
      aws ssm start-session --region ${AWS::Region} --target ${Host}
      --document-name AWS-StartPortForwardingSession
      --parameters '{"portNumber":["3000"],"localPortNumber":["3000"]}'
