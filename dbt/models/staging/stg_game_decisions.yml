version: 2

models:
  - name: stg_game_decisions
    description: >-
      Pitching decisions assigned by MLB in the currently selected revision
      of each game. Rows identify the winning pitcher, losing pitcher, and,
      when applicable, the pitcher credited with a save. Its grain is one
      decision type per game_pk.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - game_pk
              - decision_type
    columns:
      # grain
      - name: game_pk
        description: MLB's stable identifier for the game.
        data_type: bigint
        data_tests:
          - not_null

      - name: decision_type
        description: Pitching decision assigned by MLB, such as winner, loser, or save.
        data_type: varchar
        data_tests:
          - not_null

      # attributes
      - name: player_id
        description: MLB identifier of the pitcher receiving the decision.
        data_type: bigint

      - name: player_name
        description: Full name of the pitcher receiving the decision.
        data_type: varchar

      # metadata
      - name: official_date
        description: Official MLB date of the game.
        data_type: date

      - name: projected_at
        description: UTC timestamp when this raw revision was projected.
        data_type: timestamp

      - name: projection_contract_version
        description: Version of the analytical projection contract used for this row.
        data_type: varchar

      - name: projection_run_id
        description: UUID of the Glue reconciliation run that projected this row.
        data_type: varchar

      - name: season
        description: MLB season containing the game.
        data_type: integer

      - name: source_revision_id
        description: SHA-256 content identity of the raw game response used for this row.
        data_type: varchar
