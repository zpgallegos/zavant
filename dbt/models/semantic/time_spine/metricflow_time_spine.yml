version: 2

models:
  - name: metricflow_time_spine
    description: >-
      Daily calendar required by MetricFlow, covering the history of major
      league baseball through two years beyond the dbt build date.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: Calendar date at daily granularity.
        data_type: date
        granularity: day
