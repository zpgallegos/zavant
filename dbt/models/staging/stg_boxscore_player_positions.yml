version: 2

models:
  - name: stg_boxscore_player_positions
    description: >-
      Ordered positions listed by MLB for each player-team entry in the
      current version of a game's boxscore. A player can have
      multiple rows when appearing at multiple positions. Its grain is
      game_pk, player_id, team_id, and position_sequence.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - game_pk
              - player_id
              - team_id
              - position_sequence
    columns:
      # grain
      - name: game_pk
        description: MLB's stable identifier for the game.
        data_type: bigint
        data_tests:
          - not_null

      - name: player_id
        description: MLB identifier of the player represented by the row.
        data_type: bigint
        data_tests:
          - not_null

      - name: team_id
        description: MLB identifier of the team represented by the row.
        data_type: bigint
        data_tests:
          - not_null

      - name: position_sequence
        description: Zero-based order of the position in MLB's boxscore position list.
        data_type: integer
        data_tests:
          - not_null

      # attributes
      - name: position_abbreviation
        description: Abbreviation of the listed position.
        data_type: varchar

      - name: position_code
        description: MLB code for the listed position.
        data_type: varchar

      - name: position_name
        description: Name of the listed position.
        data_type: varchar

      - name: position_type
        description: Broad category of the listed position.
        data_type: varchar

      - name: team_side
        description: Team's assignment in the game, either away or home.
        data_type: varchar

      # metadata
      - name: official_date
        description: Official MLB date of the game.
        data_type: date

      - name: season
        description: MLB season containing the game.
        data_type: integer
