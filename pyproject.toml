[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zavant"
version = "0.11.0"
description = "An end-to-end, local-first MLB analytics platform"
readme = "readme.md"
requires-python = ">=3.11"
authors = [{name = "Zavant contributors"}]
dependencies = ["boto3>=1.40,<2"]

[project.optional-dependencies]
local = [
    "pyarrow==19.0.1",
]
dev = [
    "coverage==7.15.4",
    "dbt-athena==1.10.2",
    "dbt-core==1.10.22",
    "dbt-metricflow==0.13.0",
    "pyarrow==19.0.1",
    "pyright==1.1.411",
    "ruff==0.16.2",
    "sqlfluff==3.4.2",
]

[project.scripts]
zavant = "zavant.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
branch = true
source = ["zavant"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.pyright]
include = ["src", "tests", "jobs"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venv = ".venv"
venvPath = "."

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F"]
