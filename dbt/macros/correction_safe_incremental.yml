version: 2

macros:
  - name: changed_statsapi_game_revisions
    description: >-
      Returns the current game and Stats API revision pairs that a
      correction-safe single-source fact must calculate. Full-refresh runs
      include every current game; incremental runs include only games whose
      current Stats API revision is not already represented in the target
      table. The target model must expose game_pk and
      statsapi_source_revision_id.

  - name: changed_statsapi_and_savant_game_revisions
    description: >-
      Returns current game and two-source revision tuples that a
      correction-safe combined fact must calculate. An incremental run selects
      a game when either its Stats API revision or its Savant date revision
      differs from the tuple already materialized in the target table. The
      Savant identity comes from the authoritative current date-revision
      mapping rather than being inferred from available event rows. It is
      compared null-safely so unavailable source data does not cause perpetual
      recalculation.

  - name: correction_safe_merge_rows
    description: >-
      Produces the rows consumed by an Iceberg merge for a correction-safe fact
      model. On incremental runs, desired rows are marked for insertion or
      update and existing rows that disappeared from a changed game's corrected
      state are emitted as deletion tombstones. Full-refresh runs return the
      desired rows without the temporary _dbt_is_deleted field. Models using
      this macro must configure matching delete_condition and insert_condition
      expressions.
    arguments:
      - name: final_cte
        type: string
        description: >-
          Name of the CTE containing the complete desired fact rows for the
          games selected in the current run.
      - name: changed_games_cte
        type: string
        description: >-
          Name of the CTE containing the game_pk values selected for
          recalculation in the current run.
      - name: unique_key
        type: list
        description: >-
          Ordered column names defining the fact grain. This must match the
          model's configured unique_key and exist in both the desired rows and
          target table.
