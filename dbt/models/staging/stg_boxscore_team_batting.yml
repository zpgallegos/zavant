version: 2

models:
  - name: stg_boxscore_team_batting
    description: >-
      Team-level batting totals reported by MLB in the projected
      revision of each game's boxscore. These aggregate the team's performance
      in the individual game. Its grain is source_revision_id, game_pk, and team_id.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - source_revision_id
              - game_pk
              - team_id
    columns:
      # grain
      - name: source_revision_id
        description: SHA-256 content identity of the raw game response used for this row.
        data_type: varchar
        data_tests:
          - not_null

      - name: game_pk
        description: MLB's stable identifier for the game.
        data_type: bigint
        data_tests:
          - not_null

      - name: team_id
        description: MLB identifier of the team represented by the row.
        data_type: bigint
        data_tests:
          - not_null

      # attributes
      - name: air_outs
        description: Air outs recorded in the batting line.
        data_type: integer

      - name: at_bats
        description: Official at-bats recorded in the batting line.
        data_type: integer

      - name: at_bats_per_home_run
        description: At-bats-per-home-run rate as formatted by MLB.
        data_type: varchar

      - name: average
        description: Batting average as formatted by MLB.
        data_type: varchar

      - name: base_on_balls
        description: Walks recorded in the batting line.
        data_type: integer

      - name: catchers_interference
        description: Times reaching base due to catcher's interference.
        data_type: integer

      - name: caught_stealing
        description: Times caught stealing.
        data_type: integer

      - name: doubles
        description: Doubles recorded in the batting line.
        data_type: integer

      - name: fly_outs
        description: Fly outs recorded in the batting line.
        data_type: integer

      - name: games_played
        description: Games played represented by the boxscore line, normally one.
        data_type: integer

      - name: ground_into_double_play
        description: Ground-ball double plays recorded in the batting line.
        data_type: integer

      - name: ground_into_triple_play
        description: Ground-ball triple plays recorded in the batting line.
        data_type: integer

      - name: ground_outs
        description: Ground outs recorded in the batting line.
        data_type: integer

      - name: hit_by_pitch
        description: Times hit by a pitch.
        data_type: integer

      - name: hits
        description: Hits recorded in the batting line.
        data_type: integer

      - name: home_runs
        description: Home runs recorded in the batting line.
        data_type: integer

      - name: intentional_walks
        description: Intentional walks recorded in the batting line.
        data_type: integer

      - name: left_on_base
        description: Runners left on base attributed to the batting line.
        data_type: integer

      - name: line_outs
        description: Line outs recorded in the batting line.
        data_type: integer

      - name: note
        description: Optional MLB note attached to the batting line.
        data_type: varchar

      - name: on_base_percentage
        description: On-base percentage as formatted by MLB.
        data_type: varchar

      - name: on_base_plus_slugging
        description: On-base plus slugging as formatted by MLB.
        data_type: varchar

      - name: pickoffs
        description: Pickoffs charged to baserunners in the batting line.
        data_type: integer

      - name: plate_appearances
        description: Plate appearances recorded in the batting line.
        data_type: integer

      - name: pop_outs
        description: Pop outs recorded in the batting line.
        data_type: integer

      - name: rbi
        description: Runs batted in recorded in the batting line.
        data_type: integer

      - name: runs
        description: Runs scored in the batting line.
        data_type: integer

      - name: sac_bunts
        description: Sacrifice bunts recorded in the batting line.
        data_type: integer

      - name: sac_flies
        description: Sacrifice flies recorded in the batting line.
        data_type: integer

      - name: slugging_percentage
        description: Slugging percentage as formatted by MLB.
        data_type: varchar

      - name: stolen_base_percentage
        description: Stolen-base success rate as formatted by MLB.
        data_type: varchar

      - name: stolen_bases
        description: Stolen bases recorded in the batting line.
        data_type: integer

      - name: strike_outs
        description: Strikeouts recorded in the batting line.
        data_type: integer

      - name: summary
        description: Compact human-readable summary of the batting line.
        data_type: varchar

      - name: team_side
        description: Team's assignment in the game, either away or home.
        data_type: varchar

      - name: total_bases
        description: Total bases recorded in the batting line.
        data_type: integer

      - name: triples
        description: Triples recorded in the batting line.
        data_type: integer

      # metadata
      - name: official_date
        description: Official MLB date of the game.
        data_type: date

      - name: projected_at
        description: UTC timestamp when this raw revision was projected.
        data_type: timestamp

      - name: projection_run_id
        description: UUID of the Glue reconciliation run that projected this row.
        data_type: varchar

      - name: season
        description: MLB season containing the game.
        data_type: integer
